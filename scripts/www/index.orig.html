<script>
(function(){
  function randomUUID(){
    if(typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function"){
      return crypto.randomUUID();
    }
    return "10000000-1000-4000-8000-100000000000".replace(/[018]/g,function(c){
      return(+c^(crypto.getRandomValues(new Uint8Array(1))[0]&(15>>(+c/4)))).toString(16);
    });
  }

  function encode(obj){return btoa(JSON.stringify(obj))}
  function decode(str){try{return JSON.parse(atob(str))}catch(e){return null}}

  function getDeviceId(){
    var storageKey="__coze_coding_device_info";
    try{
      var info=decode(localStorage.getItem(storageKey));
      if(info&&typeof info.did==="string"){return info.did}
    }catch(e){}
    var newInfo={did:randomUUID()};
    try{localStorage.setItem(storageKey,encode(newInfo))}catch(e){}
    return newInfo.did;
  }

  function sendPageViewEvent(){
    var deviceId=getDeviceId();
    var projectId="7690516429887717416";
    var reportURL="https://code.coze.cn/api/coding/deployment/analytics/report?project_id="+encodeURIComponent(projectId)+"&did="+encodeURIComponent(deviceId);
    try{
      fetch(reportURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          events:[{
            type:"page_view",
            url:window.location.href,
            path:window.location.pathname,
            referrer:document.referrer,
            timestamp:Date.now()
          }]
        })
      }).catch(function(){});
    }catch(e){}
  }

  if(document.readyState==="complete"){
    sendPageViewEvent();
  }else{
    document.addEventListener("readystatechange",function(){
      if(document.readyState==="complete"){sendPageViewEvent()}
    });
  }
})();
</script>

  <style>
    /* 课后作业“小奇生成中”过渡卡片动画（20261016 功能一） */
    @keyframes hwGenPulse { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.18) rotate(12deg); } }
    .hw-gen-emoji { display: inline-block; animation: hwGenPulse 1.2s ease-in-out infinite; }
    /* 课堂练习提交对错鼓励语弹层（20261016 功能二）：居中大字、绿/橙分色、数秒自动消失 */
    .praise-pop {
      position: fixed; left: 50%; top: 38%; z-index: 90;
      transform: translate(-50%, -50%) scale(.85);
      max-width: 82%; padding: 18px 30px; border-radius: 18px;
      font-size: 20px; font-weight: 800; line-height: 1.6; text-align: center;
      box-shadow: 0 12px 34px rgba(22, 35, 59, .22);
      opacity: 0; pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }
    .praise-pop.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .praise-pop.ok { background: #e7f7ec; color: #1d7a38; border: 2px solid #58b26a; }
    .praise-pop.no { background: #fff3e4; color: #b3540a; border: 2px solid #f0a04b; }
    /* 自我评价 AI 评价卡片补充（20261016 功能三） */
    .self-eval-stars { margin-top: 8px; font-size: 15px; color: var(--ink-soft); }
    .self-eval-stars b { color: #f5a623; font-size: 18px; letter-spacing: 2px; }
    .self-eval-ai { margin-top: 10px; font-size: 14px; font-weight: 800; color: var(--blue-dark); }
    /* 工具弹层加载提示（20261016 优化二）：覆盖 iframe 区域，load 后隐藏，12s 兜底 */
    .gm-box { position: relative; }
    .gm-loading {
      position: absolute; left: 0; right: 0; top: 45px; bottom: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: var(--ink-soft); font-weight: 700; font-size: 17px;
    }
    .gm-loading.hidden { display: none; }

  <div class="wrap">

      <div class="tip">《观察物体（二）》· 请输入你的学号</div>

    <div id="main" class="hidden">
      <div class="tabs" id="tabs">
